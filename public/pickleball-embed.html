<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ARC Pickleball Meetup RSVP</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      #stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 20% 20%, rgba(34, 197, 94, 0.35), transparent 30%),
          radial-gradient(circle at 80% 10%, rgba(56, 189, 248, 0.35), transparent 35%),
          linear-gradient(135deg, #031b3d 0%, #075985 42%, #0f766e 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: white;
      }

      #stage::before {
        content: "";
        position: absolute;
        inset: -40px;
        background:
          linear-gradient(rgba(255,255,255,0.08) 2px, transparent 2px),
          linear-gradient(90deg, rgba(255,255,255,0.08) 2px, transparent 2px);
        background-size: 120px 120px;
        transform: rotate(-8deg);
        opacity: 0.45;
      }

      #stage::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, transparent 49.7%, rgba(255,255,255,0.22) 50%, transparent 50.3%),
          linear-gradient(0deg, transparent 49.7%, rgba(255,255,255,0.16) 50%, transparent 50.3%);
        opacity: 0.35;
        pointer-events: none;
      }

      #particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }

      .card {
        position: relative;
        z-index: 2;
        background: rgba(3, 18, 43, 0.54);
        padding: 36px 30px;
        border-radius: 26px;
        width: min(460px, 91vw);
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.38);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }

      .tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        margin-bottom: 14px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.13);
        border: 1px solid rgba(255, 255, 255, 0.18);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.4px;
        text-transform: uppercase;
      }

      h1 {
        font-size: 32px;
        margin: 0 0 14px;
        letter-spacing: -0.5px;
      }

      p {
        font-size: 16px;
        line-height: 1.5;
        margin: 0 0 22px;
      }

      .buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
      }

      button {
        font-size: 16px;
        padding: 12px 22px;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
        transition: filter 0.18s ease, transform 0.18s ease, opacity 0.18s ease;
      }

      button:active {
        filter: brightness(0.95);
      }

      #yes {
        background: linear-gradient(135deg, #22c55e, #84cc16);
        color: #062513;
        font-weight: 900;
        transform-origin: center;
      }

      #no {
        background: rgba(255, 255, 255, 0.16);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.24);
        font-weight: 800;
      }

      .form {
        display: grid;
        gap: 10px;
        margin: 12px 0 12px;
      }

      .form input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.22);
        background: rgba(255,255,255,0.12);
        color: white;
        outline: none;
        font-size: 14px;
      }

      .form input::placeholder {
        color: rgba(255,255,255,0.78);
      }

      .form input:focus {
        border-color: rgba(132, 204, 22, 0.7);
        background: rgba(255,255,255,0.16);
      }

      .slots {
        display: grid;
        gap: 12px;
        margin-top: 8px;
      }

      .slot {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-align: left;
        border-radius: 20px;
        padding: 18px 20px;
        background: rgba(255, 255, 255, 0.13);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.24);
        transition: transform 0.16s ease, filter 0.16s ease, background 0.16s ease;
      }

      .slot:hover {
        transform: translateY(-2px);
        filter: brightness(1.04);
        background: rgba(255,255,255,0.18);
      }

      .slot-left {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .slot-time {
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 0.2px;
      }

      .slot-sub {
        margin-top: 4px;
        font-size: 13px;
        opacity: 0.93;
      }

      .slot-price {
        font-size: 24px;
        font-weight: 950;
        letter-spacing: 0.5px;
        opacity: 0.98;
        padding-left: 16px;
        color: #bbf7d0;
      }

      .particle {
        position: absolute;
        opacity: 0.95;
        transform: translate(-50%, -50%);
        animation: floatUp 4s linear forwards;
        filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.24));
      }

      @keyframes floatUp {
        0% {
          transform: translate(-50%, -50%) translateY(0) scale(0.25) rotate(0deg);
          opacity: 0;
        }
        12% {
          opacity: 0.95;
        }
        100% {
          transform: translate(-50%, -50%) translateY(-260px) scale(2.4) rotate(22deg);
          opacity: 0;
        }
      }

      .shake {
        animation: shake 0.22s linear 1;
      }

      @keyframes shake {
        0% { transform: translateX(0); }
        20% { transform: translateX(-3px); }
        40% { transform: translateX(3px); }
        60% { transform: translateX(-2px); }
        80% { transform: translateX(2px); }
        100% { transform: translateX(0); }
      }

      .spinner {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        border: 3px solid rgba(255,255,255,0.35);
        border-top-color: rgba(255,255,255,0.95);
        display: inline-block;
        animation: spin 0.8s linear infinite;
        vertical-align: -3px;
        margin-right: 10px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .big-status {
        margin: 14px 0 0;
        font-size: 16px;
        font-weight: 800;
        opacity: .98;
        line-height: 1.35;
      }

      .bottom-note {
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        margin: 0;
        font-size: 12px;
        opacity: 0.85;
        letter-spacing: 0.2px;
        z-index: 3;
        pointer-events: none;
        width: min(90vw, 520px);
      }

      .mini-map {
        margin-top: 12px;
        padding: 12px;
        border-radius: 18px;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.16);
        font-size: 13px;
        line-height: 1.45;
      }

      .mini-map a {
        color: #bbf7d0;
        font-weight: 900;
        text-decoration: none;
      }

      .mini-map a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div id="stage">
      <div id="particles"></div>

      <div class="card" id="card">
        <div class="tag">ARC Meetup • Pickleball</div>

        <h1>You pulling up? 🏓</h1>

        <p>
          ARC Pickleball Meetup<br />
          Friday June 6, 2026 • 6:00 PM – 9:00 PM<br />
          Crowley Park 🎾
        </p>

        <div class="buttons">
          <button id="yes" type="button" onclick="sayYes()">I’m in 🏓</button>
          <button id="no" type="button" onmouseenter="moveNo()" onpointerdown="moveNo()">
            No 😅
          </button>
        </div>
      </div>

      <p class="bottom-note" id="note">Psst… “No” has terrible footwork.</p>
    </div>

    <script>
  const noSound = new Audio(
    "https://drive.google.com/uc?export=download&id=1MtujUl_ES9NUWjQK7vRvwUo9YaESUgun"
  );
  noSound.volume = 0.5;
  noSound.preload = "auto";

  function vibe(pattern = [25]) {
    try {
      if (navigator.vibrate) navigator.vibrate(pattern);
    } catch (_) {}
  }

  const stage = document.getElementById("stage");
  const particlesLayer = document.getElementById("particles");

  const API_URL =
    "https://script.google.com/macros/s/AKfycbzEMLlSNdTtPfvs0M7vLrHshuiDGCnEutXhF1J7Xw4n-O7tYqZep2Q0lNJ8i37tzecw4Q/exec";

  const CHECKOUT_API = "/api/checkout";

  const EVENT_ID = "pickleball";
  const EVENT_TITLE = "ARC Pickleball Meetup";
  const EVENT_SLOT = "6:00-9:00";
  const EVENT_DATE = "Saturday June 6, 2026";
  const EVENT_LOCATION = "Crowley Park";
  const MAP_URL = "https://maps.app.goo.gl/EUS3xE7742taSz8u7";

  const PRICE_STRIPE = 5;
  const PRICE_LATER = 10.00;

  const RSVP_CUTOFF = new Date("2026-06-01T23:59:00-04:00");

  const DRAFT_KEY = "pickleball_rsvp_draft_v1";

  function isRegistrationClosed() {
    return new Date() >= RSVP_CUTOFF;
  }

  function saveDraft_(obj) {
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify(obj));
    } catch (_) {}
  }

  function loadDraft_() {
    try {
      const raw = localStorage.getItem(DRAFT_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (_) {
      return null;
    }
  }

  function clearDraft_() {
    try {
      localStorage.removeItem(DRAFT_KEY);
    } catch (_) {}
  }

  let pendingRSVP = null;
  let stepStack = [];

  function pushStep(step) {
    if (stepStack[stepStack.length - 1] !== step) stepStack.push(step);
  }

  function goStep(step) {
    if (step === "form") showRSVPForm();
    if (step === "pay") showPaymentStep_(pendingRSVP?.slot || EVENT_SLOT);
  }

  function backStep() {
    if (stepStack.length <= 1) return;
    stepStack.pop();
    goStep(stepStack[stepStack.length - 1]);
  }

  function navBarHtml() {
    return `
      <div style="display:flex; align-items:center; justify-content:flex-start; margin-bottom:14px;">
        <button type="button" onclick="backStep()" aria-label="Back"
          style="
            background: rgba(255,255,255,0.14);
            color:#fff;
            border-radius:999px;
            padding:12px 17px;
            font-size:20px;
            font-weight:900;
            box-shadow: 0 10px 24px rgba(0,0,0,0.18);
            border: 1px solid rgba(255,255,255,0.22);
            cursor:pointer;
          ">
          ←
        </button>
      </div>
    `;
  }

  (function handleStatusFromQuery_() {
    const qs = new URLSearchParams(window.location.search);
    const status = qs.get("status");

    if (!status) return;

    const draft = loadDraft_();
    if (draft) pendingRSVP = draft;

    const card = document.getElementById("card");

    if (status === "success") {
      burstParticles(40, stage.clientWidth / 2, stage.clientHeight / 2);
      clearDraft_();

      card.innerHTML = `
        <div class="tag">Paid</div>

        <h1 style="margin:0 0 10px;">You’re confirmed ✅🏓</h1>

        <p style="margin:0; line-height:1.6;">
          <b>${EVENT_TITLE}</b><br/>
          ${EVENT_DATE}<br/>
          6:00 PM – 9:00 PM<br/>
          ${EVENT_LOCATION}
          <br/><br/>
          Slot: <b>${pendingRSVP?.slot || EVENT_SLOT}</b><br/>
          Email: <b>${pendingRSVP?.email || ""}</b>
        </p>

        <div class="mini-map">
          📍 <a href="${MAP_URL}" target="_blank" rel="noopener noreferrer">Open Crowley Park in Google Maps →</a>
        </div>

        <p style="margin:14px 0 0; font-size:12px; opacity:.9; line-height:1.5;">
          Need to cancel or change your RSVP? Reply to the confirmation email.
        </p>
      `;
    }

    if (status === "cancel") {
      card.innerHTML = `
        <div class="tag">Payment canceled</div>

        <h1 style="margin:0 0 10px;">Payment canceled</h1>

        <p style="margin:0; line-height:1.55;">
          Your payment wasn’t completed.
          <br/><br/>
          If you still want the spot, choose “Pay now” again.
        </p>

        <div style="margin-top:14px; text-align:center;">
          <button type="button" onclick="showRSVPForm()" style="background: rgba(255,255,255,0.16); color:#fff;">
            Back to RSVP
          </button>
        </div>
      `;
    }
  })();

  function clamp(n, min, max) {
    return Math.max(min, Math.min(n, max));
  }

  function rectsOverlap(a, b) {
    return !(
      a.right <= b.left ||
      a.left >= b.right ||
      a.bottom <= b.top ||
      a.top >= b.bottom
    );
  }

  function setBusyMessage(id, text) {
    const el = document.getElementById(id);
    if (!el) return;
    el.className = "big-status";
    el.innerHTML = `<span class="spinner"></span>${text}`;
  }

  function setPlainMessage(id, text) {
    const el = document.getElementById(id);
    if (!el) return;
    el.className = "big-status";
    el.textContent = text;
  }

  function spawnParticle(x, y) {
    const particle = document.createElement("div");
    particle.className = "particle";

    const options = ["🏓", "🎾", "💙", "⚡", "🟢"];
    particle.textContent = options[Math.floor(Math.random() * options.length)];

    const size = 10 + Math.random() * 22;
    particle.style.fontSize = size + "px";
    particle.style.left = x + "px";
    particle.style.top = y + "px";

    particlesLayer.appendChild(particle);
    particle.addEventListener("animationend", () => particle.remove());
  }

  setInterval(() => {
    spawnParticle(
      Math.random() * stage.clientWidth,
      Math.random() * stage.clientHeight
    );
  }, 420);

  function burstParticles(
    count = 14,
    x = stage.clientWidth / 2,
    y = stage.clientHeight / 2
  ) {
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const spreadX = (Math.random() - 0.5) * 280;
        const spreadY = (Math.random() - 0.5) * 180;
        spawnParticle(x + spreadX, y + spreadY);
      }, i * 14);
    }
  }

  async function postRSVP(payload) {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    });
    return res.json();
  }

  async function loadAvailability() {
    try {
      const res = await fetch(`${API_URL}?action=availability`);
      const data = await res.json();

      const slotData = data?.availability?.[EVENT_SLOT];
      const spots = document.getElementById("spotsA");
      const slotBtn = document.getElementById("slotA");

      if (spots) spots.textContent = "Loading…";

      if (spots && slotData) {
        spots.textContent = `${slotData.left} spots left`;
      }

      if (slotBtn && slotData) {
        if (slotData.left <= 0) {
          slotBtn.classList.add("full");
          slotBtn.disabled = true;
          if (spots) spots.textContent = "Full";
        } else {
          slotBtn.classList.remove("full");
          slotBtn.disabled = false;
        }
      }
    } catch (err) {
      const spots = document.getElementById("spotsA");
      if (spots) spots.textContent = "Unavailable";

      const msg = document.getElementById("msg");
      if (msg) msg.textContent = "Couldn’t load spots right now. Try again in a sec.";
    }
  }

  let availabilityRefreshTimer = null;

  function showRSVPForm() {
    const card = document.getElementById("card");
    const note = document.getElementById("note");

    if (note) note.textContent = "Bring water. Bring energy. We’ll handle the vibes.";

    pushStep("form");

    if (isRegistrationClosed()) {
      card.innerHTML = `
        ${navBarHtml()}

        <div class="tag">Registration Closed</div>

        <h1 style="margin:0 0 10px;">RSVP closed 🏓</h1>

        <p style="margin:0 0 14px; line-height:1.55;">
          Registration for ${EVENT_TITLE} is closed.
          <br/><br/>
          Event: <b>${EVENT_DATE}</b><br/>
          Time: <b>6:00 PM – 9:00 PM</b><br/>
          Location: <b>${EVENT_LOCATION}</b>
        </p>

        <div class="mini-map">
          📍 <b>${EVENT_LOCATION}</b><br/>
          <a href="${MAP_URL}" target="_blank" rel="noopener noreferrer">Open location in Google Maps →</a>
        </div>
      `;
      return;
    }

    card.innerHTML = `
      ${navBarHtml()}

      <div class="tag">Paid RSVP • $5</div>

      <h1 style="margin:0 0 10px;">Game time 🏓</h1>

      <p style="margin:0 0 14px; line-height:1.55;">
        ${EVENT_DATE}<br/>
        <b>6:00 PM – 9:00 PM</b><br/>
        ${EVENT_LOCATION}
      </p>

      <div class="mini-map">
        📍 <b>${EVENT_LOCATION}</b><br/>
        <a href="${MAP_URL}" target="_blank" rel="noopener noreferrer">Open location in Google Maps →</a>
      </div>

      <div class="form">
        <input id="rsvpName"  type="text"  placeholder="Your name" autocomplete="name" />
        <input id="rsvpEmail" type="email" placeholder="Email for confirmation" autocomplete="email" />
        <input id="rsvpPhone" type="tel"   placeholder="Phone optional" autocomplete="tel" />
      </div>

      <div class="slots">
        <button class="slot" id="slotA" type="button" onclick="chooseSlot('${EVENT_SLOT}')">
          <div class="slot-left">
            <div class="slot-time">6:00 PM – 9:00 PM</div>
            <div class="slot-sub">
              Pickleball meetup • <span class="spots" id="spotsA">Loading…</span>
            </div>
          </div>
          <div class="slot-price">$5</div>
        </button>
      </div>

      <p style="margin:12px 0 0; font-size:12px; opacity:.9;">
        $5 helps make sure people who sign up actually show up.
      </p>

      <p id="msg" style="margin:12px 0 0; font-size:13px; opacity:.95;"></p>
    `;

    loadAvailability();

    if (availabilityRefreshTimer) clearInterval(availabilityRefreshTimer);
    availabilityRefreshTimer = setInterval(loadAvailability, 12000);

    const draft = pendingRSVP || loadDraft_();
    if (draft) {
      pendingRSVP = draft;
      const n = document.getElementById("rsvpName");
      const e = document.getElementById("rsvpEmail");
      const p = document.getElementById("rsvpPhone");
      if (n) n.value = draft.name || "";
      if (e) e.value = draft.email || "";
      if (p) p.value = draft.phone || "";
    }
  }

  async function chooseSlot(slot) {
    if (isRegistrationClosed()) {
      setPlainMessage("msg", "Registration is closed.");
      return;
    }

    const name = (document.getElementById("rsvpName")?.value || "").trim();
    const email = (document.getElementById("rsvpEmail")?.value || "").trim();
    const phone = (document.getElementById("rsvpPhone")?.value || "").trim();

    if (!name) {
      setPlainMessage("msg", "Add your name first.");
      return;
    }

    if (!email) {
      setPlainMessage("msg", "Add your email so we can confirm your RSVP.");
      return;
    }

    if (availabilityRefreshTimer) clearInterval(availabilityRefreshTimer);
    availabilityRefreshTimer = null;

    pendingRSVP = {
      eventId: EVENT_ID,
      eventTitle: EVENT_TITLE,
      eventDate: EVENT_DATE,
      location: EVENT_LOCATION,
      name,
      email,
      phone,
      slot,
    };

    saveDraft_(pendingRSVP);

    pushStep("form");
    pushStep("pay");

    showPaymentStep_(slot);
  }

  function showPaymentStep_(slot) {
    const card = document.getElementById("card");

    pushStep("pay");

    card.innerHTML = `
      ${navBarHtml()}

      <div class="tag">Payment</div>

      <h1 style="margin:0 0 10px;">Lock in your spot 🏓</h1>

      <p style="margin:0 0 14px; line-height:1.55;">
        You picked: <b>6:00 PM – 9:00 PM</b><br/>
        Choose how you want to pay:
      </p>

      <div style="display:grid; gap:12px; margin-top:10px;">
        <button class="slot" type="button" onclick="payNowStripe_()">
          <div class="slot-left">
            <div class="slot-time">Pay now card</div>
            <div class="slot-sub">Stripe checkout • instant confirmation</div>
          </div>
          <div class="slot-price">$${PRICE_STRIPE.toFixed(2)}</div>
        </button>

        <button class="slot" type="button" onclick="payLaterInPerson_()">
          <div class="slot-left">
            <div class="slot-time">Pay in person</div>
            <div class="slot-sub">Bring $${PRICE_LATER} day-of</div>
          </div>
          <div class="slot-price">$${PRICE_LATER}</div>
        </button>
      </div>

      <p style="margin:14px 0 0; font-size:12px; opacity:.9; line-height:1.5;">
        Need to cancel or change your RSVP? Reply to your confirmation email so we can update the count.
      </p>

      <p id="payMsg" style="margin:12px 0 0; font-size:13px; opacity:.95;"></p>
    `;
  }

  function setPayButtonsDisabled_(disabled) {
    document.querySelectorAll(".slot").forEach((btn) => {
      if (btn && btn.tagName === "BUTTON") btn.disabled = disabled;
    });
  }

  function showZelleInstructions_(slot) {
    const card = document.getElementById("card");

    const qrHtml = `
      <img
        src="${ZELLE_QR_IMG}"
        alt="Zelle QR"
        style="width:min(260px, 70vw); border-radius:16px; border:1px solid rgba(255,255,255,0.25);"
        onerror="this.style.display='none'; document.getElementById('qrFail').style.display='block';"
      />
      <div id="qrFail" style="display:none; padding:14px; border-radius:16px; border:1px dashed rgba(255,255,255,0.45); opacity:.95;">
        QR image not found. Check the filename/path in <b>ZELLE_QR_IMG</b>.
      </div>
    `;

    vibe([35, 30, 35]);
    burstParticles(40, stage.clientWidth / 2, stage.clientHeight / 2);

    clearDraft_();

    card.innerHTML = `
      <div class="tag">Booked</div>

      <h1 style="margin:0 0 10px;">You’re booked ✅🏓</h1>

      <p style="margin:0 0 12px; line-height:1.55;">
        Slot: <b>${slot}</b><br/>
        Payment: <b>Zelle</b> ($${PRICE_LATER})<br/><br/>
        Send $${PRICE_LATER} on Zelle to:<br/>
        <b>${ZELLE_PAY_TO}</b>
      </p>

      <div style="display:flex; justify-content:center; margin:10px 0 12px;">
        ${qrHtml}
      </div>

      <p style="margin:0; line-height:1.55;">
        Check your email for confirmation.
      </p>

      <div class="mini-map">
        📍 <a href="${MAP_URL}" target="_blank" rel="noopener noreferrer">Open Crowley Park in Google Maps →</a>
      </div>
    `;
  }

  async function payLaterZelle_() {
    if (!pendingRSVP) {
      setPlainMessage("payMsg", "Missing RSVP info — go back and try again.");
      return;
    }

    setPayButtonsDisabled_(true);
    setBusyMessage("payMsg", "Saving your spot…");

    try {
      const data = await postRSVP({
        ...pendingRSVP,
        payChoice: "pay_later",
        paymentStatus: "NOT PAID",
        paymentMethod: "zelle",
      });

      if (!data.ok) {
        setPlainMessage("payMsg", data.error || "Something went wrong.");
        setPayButtonsDisabled_(false);
        return;
      }

      if (data.rsvpId) {
        pendingRSVP = { ...pendingRSVP, rsvpId: data.rsvpId };
        saveDraft_(pendingRSVP);
      }

      showZelleInstructions_(pendingRSVP.slot);
    } catch (err) {
      setPlainMessage("payMsg", "Couldn’t save right now. Try again.");
    } finally {
      setPayButtonsDisabled_(false);
    }
  }

  async function payNowStripe_() {
    if (!pendingRSVP) {
      setPlainMessage("payMsg", "Missing RSVP info — go back and try again.");
      return;
    }

    setPayButtonsDisabled_(true);
    setBusyMessage("payMsg", "Holding your spot… sending you to Stripe.");

    try {
      let rsvpId = pendingRSVP.rsvpId;

      if (!rsvpId) {
        const data = await postRSVP({
          ...pendingRSVP,
          payChoice: "pay_now",
          paymentStatus: "NOT PAID",
          paymentMethod: "stripe",
        });

        if (!data.ok) {
          setPlainMessage("payMsg", data.error || "Something went wrong.");
          setPayButtonsDisabled_(false);
          return;
        }

        rsvpId = data.rsvpId;

        if (!rsvpId) {
          setPlainMessage("payMsg", "Missing RSVP id from server.");
          setPayButtonsDisabled_(false);
          return;
        }

        pendingRSVP = { ...pendingRSVP, rsvpId };
        saveDraft_(pendingRSVP);
      }

      const r = await fetch(CHECKOUT_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
  amount: PRICE_STRIPE,
  rsvpId,
  email: pendingRSVP.email,
  returnPath: window.location.pathname,
  eventName: EVENT_TITLE,
}),
      });

      const out = await r.json().catch(() => ({}));

      if (!out?.url) {
        setPlainMessage("payMsg", out?.error || "Couldn’t start checkout.");
        setPayButtonsDisabled_(false);
        return;
      }

      if (window.top) window.top.location.href = out.url;
      else window.location.href = out.url;
    } catch (err) {
      setPlainMessage("payMsg", "Checkout failed. Try again.");
      setPayButtonsDisabled_(false);
    }
  }

  function sayYes() {
    const noBtn = document.getElementById("no");
    if (noBtn) noBtn.remove();

    vibe([35, 30, 35]);
    burstParticles(32, stage.clientWidth / 2, stage.clientHeight / 2);

    setTimeout(() => {
      showRSVPForm();
      setTimeout(() => burstParticles(24, stage.clientWidth / 2, stage.clientHeight / 2), 120);
    }, 120);
  }

  let noIsFloating = false;
  let noMoves = 0;

  function moveNo() {
    const no = document.getElementById("no");
    const yes = document.getElementById("yes");
    if (!no || !yes) return;

    noSound.currentTime = 0;
    noSound.play().catch(() => {});

    vibe([20]);
    no.classList.remove("shake");
    void no.offsetWidth;
    no.classList.add("shake");

    const stageRect = stage.getBoundingClientRect();

    if (!noIsFloating) {
      const placeholder = document.createElement("span");
      placeholder.style.display = "inline-block";
      placeholder.style.width = no.offsetWidth + "px";
      placeholder.style.height = no.offsetHeight + "px";
      no.parentNode.insertBefore(placeholder, no);

      const r = no.getBoundingClientRect();
      stage.appendChild(no);

      no.style.position = "absolute";
      no.style.zIndex = "9999";
      no.style.left = r.left - stageRect.left + "px";
      no.style.top = r.top - stageRect.top + "px";

      noIsFloating = true;
    }

    noMoves += 1;
    const yesScale = Math.min(1 + noMoves * 0.07, 2.1);
    yes.style.transform = `scale(${yesScale})`;

    const padX = 20;
    const padTop = 70;
    const padBottom = 110;

    const noW = no.offsetWidth;
    const noH = no.offsetHeight;

    const minX = padX;
    const maxX = Math.max(minX, stage.clientWidth - noW - padX);

    const minY = padTop;
    const maxY = Math.max(minY, stage.clientHeight - noH - padBottom);

    const yesRect = yes.getBoundingClientRect();
    const avoidMargin = 34;

    const avoid = {
      left: yesRect.left - stageRect.left - avoidMargin,
      top: yesRect.top - stageRect.top - avoidMargin,
      right: yesRect.right - stageRect.left + avoidMargin,
      bottom: yesRect.bottom - stageRect.top + avoidMargin,
    };

    let x = minX, y = minY, tries = 0;

    do {
      x = Math.random() * (maxX - minX) + minX;
      y = Math.random() * (maxY - minY) + minY;
      tries++;
    } while (
      rectsOverlap({ left: x, top: y, right: x + noW, bottom: y + noH }, avoid) &&
      tries < 90
    );

    x = clamp(x, minX, maxX);
    y = clamp(y, minY, maxY);

    no.style.left = x + "px";
    no.style.top = y + "px";

    burstParticles(7, x + noW / 2, y + noH / 2);
  }

  window.addEventListener("resize", () => {
    const no = document.getElementById("no");
    if (!noIsFloating || !no) return;

    const noW = no.offsetWidth;
    const noH = no.offsetHeight;

    const padX = 20;
    const padTop = 70;
    const padBottom = 110;

    const minX = padX;
    const maxX = Math.max(minX, stage.clientWidth - noW - padX);

    const minY = padTop;
    const maxY = Math.max(minY, stage.clientHeight - noH - padBottom);

    const curX = parseFloat(no.style.left) || minX;
    const curY = parseFloat(no.style.top) || minY;

    no.style.left = clamp(curX, minX, maxX) + "px";
    no.style.top = clamp(curY, minY, maxY) + "px";
  });
</script>
